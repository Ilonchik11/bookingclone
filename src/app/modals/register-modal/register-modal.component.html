<div class="modal" *ngIf="isVisible">
    <div class="modal-content">
      <span class="close" (click)="closeModal()">
        <img src="/assets/svg/closeModal.svg" alt="closeModal">
      </span>
      <div class="header">Register</div>
      <form (ngSubmit)="onSubmit()">
        <div>
          <input type="text" id="email" [(ngModel)]="email" name="email" placeholder="Email" required>
        </div>
        <div class="underText">We will send you an email to confirm your email address</div>
        <div>
          <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Password" required>
        </div>
        <div>
            <input type="password" id="repeatPassword" [(ngModel)]="repeatPassword" name="repeatPassword" placeholder="Repeat Password" required>
          </div>
        <div class="underText">*Get acquainted with our <span style="color: var(--purple-color);">Privacy policy</span></div>
        <button type="submit" class="continue-btn" (click)="navigateToAuthentication()"
        [disabled]="!isFormValid()" [ngClass]="{'active-button': isFormValid(), 'inactive-button': !isFormValid()}"
        >Continue</button>
      </form>
      <div class="alternative-login">
        <button (click)="loginWithGoogle()">
          <img src="/assets/svg/logos-google.svg" alt="logos-google">
          Sign In with Google
        </button>
        <button (click)="loginWithFacebook()">
          <img src="/assets/svg/logos-facebook.svg" alt="logos-facebook">
          Sign In with Facebook
        </button> 
        <button (click)="loginWithApple()">
          <img src="/assets/svg/logos-apple.svg" alt="logos-apple">
          Sign In with Apple
        </button>
      </div>      
    </div>
  </div>
