<div class="modal" *ngIf="isVisible">
    <div class="modal-content">
      <span class="close" (click)="closeModal()">
        <img src="/assets/svg/closeModal.svg" alt="closeModal">
      </span>
      <div class="header">Authentication</div>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div>
          <input type="text" id="code" 
          formControlName="code"
          name="code" placeholder="Code" required>
        </div>
        <div class="underText">We have sent you an email with the code. Check your mail and enter the code for the authentication </div>
        <button type="submit" class="continue-btn" 
        [disabled]="!this.form.valid" (click)="navigateToInformation()"
        [ngClass]="{'active-button': this.form.valid, 'inactive-button': !this.form.valid}"
        >Continue</button>
      </form>   
    </div>
  </div>
